name: Android build

# Builds a shareable APK via EAS.
#
# Deliberately NOT on every push: the EAS free tier allows 15 Android builds a
# month, and building on each commit would exhaust that in days. Tag a release
# when you want a new build for the family:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# `workflow_dispatch` covers one-off builds without creating a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development
          - production

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # First, before checkout or npm ci: without the token every later step is
      # wasted work, and the failure it produces names neither the secret nor
      # where to set it.
      - name: Check the Expo token is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Create one at https://expo.dev/settings/access-tokens, then add it under Settings -> Secrets and variables -> Actions as a repository secret named EXPO_TOKEN. Note that repository transfers do not carry over secrets inherited from an organisation."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # A broken build costs one of the month's 15 free builds, so verify
      # locally-checkable things first — it is much cheaper to fail here.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

      - name: Build APK
        id: build
        # Supabase config comes from EAS environment variables set on the
        # profile (`eas env:create`), not from these secrets — the build runs on
        # Expo's infrastructure, not this runner.
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building with profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json > build-result.json
          cat build-result.json

      - name: Publish the install link
        if: success()
        run: |
          URL=$(node -e "
            const r = require('./build-result.json');
            const b = Array.isArray(r) ? r[0] : r;
            console.log(b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || '');
          ")
          {
            echo "## Android build ready"
            echo ""
            if [ -n "$URL" ]; then
              echo "Install on your phone: $URL"
            else
              echo "Build finished, but no artifact URL was returned. Check https://expo.dev."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build-result.json
          retention-days: 30
          if-no-files-found: ignore
